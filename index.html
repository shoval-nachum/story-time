<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Story Time</title>
  <meta id="theme-color" name="theme-color" content="#ffeec4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Story Time">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="home" class="home">
    <div id="home-scroll" class="home-scroll">
      <div class="home-col">
        <!-- הדמות היא הממשק: נוגעים בה כדי לספר, והיא מקשיבה, כותבת בפתק ומחכה לתשובה בבועות -->
        <form id="topic-form" class="topic-form home-stage">
          <h1 class="logo" dir="ltr">Story Time</h1>
          <div class="hello">
            <span id="mic-label" class="mic-label">אז מה ניצור היום?</span>
            <span id="child-name" class="child-name">מיה</span>
          </div>

          <div id="koala-stage" class="buddy" data-state="idle"></div>
          <button id="koala-btn" class="buddy-btn" type="button" aria-label="ספרי לי על מה הסיפור"></button>

          <button id="yes-btn" class="answer answer-yes" type="button" hidden aria-label="כן, זה הסיפור"><span aria-hidden="true">👍</span></button>
          <button id="no-btn" class="answer answer-no" type="button" hidden aria-label="לא, אגיד שוב"><span aria-hidden="true">👎</span></button>

          <p id="heard" class="heard" hidden></p>
          <p id="note" class="note" role="status"></p>
          <button id="cancel-btn" class="ghost cancel-btn" type="button" hidden>ביטול</button>

          <!-- הקלדה: רק במכשיר שאין בו מיקרופון -->
          <div id="type-ui" class="type-ui" hidden>
            <label for="topic">על מה הסיפור?</label>
            <textarea id="topic" rows="2" placeholder="חיידק שגדל בתוך הפה…" autocomplete="off"></textarea>
            <button id="create-btn" type="submit">צרו סיפור</button>
          </div>
        </form>

    <section id="library" class="library glib" hidden aria-labelledby="library-title">
      <div class="library-bar">
        <h2 id="library-title">הסיפורים שלי</h2>
        <button id="select-btn" class="tool" type="button" aria-pressed="false">בחירה</button>
        <div class="segmented sort-group" role="group" aria-label="סידור">
          <button type="button" data-sort="date" aria-pressed="true">חדשים</button>
          <button type="button" data-sort="name" aria-pressed="false">א–ת</button>
        </div>
        <div class="segmented view-group" role="group" aria-label="תצוגה">
          <button type="button" data-view="grid" aria-pressed="true" aria-label="ריבועים">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" data-view="list" aria-pressed="false" aria-label="שורות">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <ul id="story-list" class="story-list grid"></ul>
      <div class="link-row">
        <button id="link-btn" class="link-btn" type="button">חיבור מכשיר נוסף למדף</button>
        <p id="link-note" class="link-note" role="status"></p>
      </div>
    </section>
      </div>
    </div>

    <div id="select-bar" class="select-bar" hidden>
      <span id="select-count" class="select-count" role="status"></span>
      <button id="delete-btn" class="delete-btn" type="button" disabled>מחיקה</button>
    </div>
  </main>

  <section id="reader" class="reader" hidden aria-label="ספר">
    <div id="stage" class="stage"></div>
    <button id="home-btn" class="home-btn" type="button" aria-label="חזרה לדף הפתיחה">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="narrate-btn" class="narrate-btn" type="button" aria-pressed="false" aria-label="הקראה">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </section>

  <script src="config.js"></script>
  <script src="story.js"></script>
  <script src="narration.js"></script>
  <script src="buddy.js"></script>
  <script src="app.js"></script>
</body>
</html>
